name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check vulgaris/ --select E,F,W --ignore E501,F401
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy vulgaris/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests (with coverage on ubuntu/3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          pytest tests/unit/ tests/test_numerical_stability.py tests/test_gradients.py \
            -v --tb=short --timeout=120 \
            --cov=vulgaris --cov=engine --cov=modules --cov=model \
            --cov=training --cov=inference --cov=serve --cov=monitoring \
            --cov-report=term-missing --cov-report=xml

      - name: Run unit tests (no coverage)
        if: "!(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11')"
        run: pytest tests/unit/ tests/test_numerical_stability.py tests/test_gradients.py -v --tb=short --timeout=120

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
