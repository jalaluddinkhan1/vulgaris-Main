name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Release
  id-token: write   # PyPI trusted publishing (OIDC — no token needed)

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Verify tag matches version in pyproject.toml ───────────────────────
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract versions and compare
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOML=$(python -c "
          import tomllib
          with open('pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "Git tag  : $TAG"
          echo "pyproject: $TOML"
          if [ "$TAG" != "$TOML" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $TOML"
            exit 1
          fi

  # ── 2. Full test suite ────────────────────────────────────────────────────
  test:
    name: Test before release
    runs-on: ubuntu-latest
    needs: verify-version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest tests/ -v --tb=short --timeout=120

  # ── 3. Build sdist + wheel ────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Verify with twine
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 4. Publish to PyPI (OIDC trusted publishing — no token) ──────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 5. Create GitHub Release with CHANGELOG extract ───────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract block between this version header and the next "## [" header
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          # Write to file to avoid shell escaping issues
          echo "$NOTES" > release_notes.md
          echo "Release notes extracted for v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
