[package]
name = "vulgaris-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "vulgaris_runtime"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
