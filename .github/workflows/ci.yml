name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint + type-check (fast gate, runs first) ──────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev deps
        run: pip install -e ".[dev]"

      - name: ruff — check all source
        run: ruff check engine/ modules/ model/ training/ inference/ serve/ monitoring/ preprocessing/ memory/ vulgaris/ --select E,F,W,I --ignore E501,F401

      - name: black — format check
        run: black --check --diff engine/ modules/ model/ training/ inference/ serve/ monitoring/ preprocessing/ memory/ vulgaris/

      - name: mypy — type check public API
        run: mypy vulgaris/ --ignore-missing-imports --no-error-summary

  # ── 2. Security scan ──────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: pip install pip-audit bandit

      - name: pip-audit — check dependencies for known CVEs
        run: pip-audit --requirement <(pip install -e ".[all]" --dry-run -q 2>&1 | grep "Would install" | sed 's/Would install //' | tr ' ' '\n' | sed 's/-[0-9].*//' || true) || pip-audit

      - name: bandit — static security analysis
        run: bandit -r engine/ modules/ model/ training/ inference/ serve/ -ll -q

  # ── 3. Test matrix ────────────────────────────────────────────────────────
  test:
    name: Test py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests (with coverage on ubuntu/3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          pytest tests/ -v --tb=short --timeout=120 \
            --cov=engine --cov=modules --cov=model \
            --cov=training --cov=inference --cov=serve \
            --cov=monitoring --cov=preprocessing --cov=memory --cov=vulgaris \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Run tests (no coverage)
        if: "!(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11')"
        run: pytest tests/ -v --tb=short --timeout=120

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4. Build (sdist + wheel) ──────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check dist with twine
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
